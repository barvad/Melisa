services:
  db:
    image: pgvector/pgvector:pg17
    container_name: melisa-db
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres123
      POSTGRES_USER: postgres
      POSTGRES_DB: melisadb
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - melisa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d melisadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  melisa:
    build:
      context: .
      dockerfile: ./Practicum.MelisaBot/Dockerfile
    container_name: melisa-bot
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GroqApiKey=<API key>
      - TgBotApiKey=<API key>
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - melisa-network

volumes:
  postgres_data:

networks:
  melisa-network: